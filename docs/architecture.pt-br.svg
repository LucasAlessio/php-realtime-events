<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" role="img" aria-labelledby="rt-title rt-desc">
  <title id="rt-title">Pipeline de Notificações em Tempo Real</title>
  <desc id="rt-desc">Um webhook de parceiro ou uma ação interna do PHP assina e envia um evento para o mesmo endpoint HTTP. O servidor em tempo real o valida, resolve quais salas do Socket.IO devem recebê-lo por tenant, usuário ou entidade, e envia uma atualização ao vivo apenas às sessões de navegador em uma sala com correspondência — sessões fora dessas salas não recebem nada.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="640" fill="#ffffff" />

  <text x="700" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Pipeline de Notificações em Tempo Real</text>
  <text x="700" y="58" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">De um evento no PHP até uma atualização ao vivo no navegador</text>

  <!-- Parceiro (externo) -->
  <rect x="20" y="205" width="140" height="85" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" />
  <text x="90" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Parceiro</text>
  <text x="90" y="253" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Externo</text>
  <text x="90" y="275" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#6b7280">(sistema externo)</text>

  <!-- PHP: webhook do parceiro -->
  <rect x="260" y="200" width="210" height="95" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" />
  <text x="365" y="228" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Backend PHP</text>
  <text x="365" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#4b5563">webhook do parceiro</text>
  <text x="365" y="266" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#6b7280">recebe e repassa</text>

  <!-- PHP: ação interna, sem parceiro envolvido -->
  <rect x="260" y="330" width="210" height="95" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" />
  <text x="365" y="358" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Backend PHP</text>
  <text x="365" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#4b5563">ação interna</text>
  <text x="365" y="396" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-style="italic" fill="#6b7280">serviço / job / cron — sem parceiro</text>

  <!-- Seta: Parceiro -> PHP webhook -->
  <line x1="162" y1="247" x2="258" y2="247" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="210" y="232" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">webhook</text>

  <!-- Setas: os dois caminhos do PHP -> Core (convergem no mesmo endpoint) -->
  <line x1="472" y1="247" x2="598" y2="283" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)" />
  <line x1="472" y1="378" x2="598" y2="299" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="535" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4b5563">POST /internal/emit</text>
  <text x="535" y="219" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4b5563">+ assinatura HMAC</text>
  <text x="535" y="233" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-style="italic" fill="#9ca3af">(mesma rota, qualquer origem)</text>

  <!-- Container do servidor -->
  <rect x="600" y="100" width="380" height="380" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2" />
  <text x="790" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#4338ca">Servidor de Eventos em Tempo Real</text>
  <text x="790" y="148" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6366f1">(este projeto)</text>

  <!-- Passo 1 -->
  <rect x="620" y="165" width="340" height="60" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" />
  <text x="790" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">1  Validar envelope</text>
  <text x="790" y="209" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4b5563">contra o registro de tipos</text>

  <line x1="790" y1="225" x2="790" y2="243" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="805" y="238" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9" font-style="italic" fill="#6b7280">tipo conhecido</text>

  <!-- Passo 2 -->
  <rect x="620" y="245" width="340" height="60" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" />
  <text x="790" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">2  Resolver audiência → salas</text>
  <text x="790" y="289" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4b5563">tenant / usuário / entidade</text>

  <line x1="790" y1="305" x2="790" y2="323" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="805" y="318" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9" font-style="italic" fill="#6b7280">salas de destino</text>

  <!-- Passo 3 -->
  <rect x="620" y="325" width="340" height="60" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" />
  <text x="790" y="350" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">3  Publicar via Socket.IO</text>
  <text x="790" y="369" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4b5563">io.to(rooms).emit(...)</text>

  <!-- Extensibilidade -->
  <rect x="620" y="400" width="340" height="55" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.25" stroke-dasharray="4 4" />
  <text x="790" y="422" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#4338ca">Novo tipo de notificação = novo schema</text>
  <text x="790" y="439" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4b5563">sem mudanças no servidor, auth ou roteamento</text>

  <!-- Container dos clientes -->
  <rect x="1070" y="100" width="300" height="380" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
  <text x="1220" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#047857">Clientes no Navegador</text>
  <text x="1220" y="148" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#059669">(React, via Socket.IO)</text>

  <!-- Cliente 1 -->
  <rect x="1090" y="165" width="260" height="90" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
  <text x="1220" y="187" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937">Usuário A — Tenant 12</text>
  <text x="1220" y="206" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#047857">tenant:12</text>
  <text x="1220" y="224" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#6b7280">vê: alertas de todo o tenant</text>

  <!-- Cliente 2 -->
  <rect x="1090" y="270" width="260" height="90" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
  <text x="1220" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937">Usuário B — Tenant 12</text>
  <text x="1220" y="311" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#047857">tenant:12:user:45</text>
  <text x="1220" y="329" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#6b7280">vê: alertas para este usuário</text>

  <!-- Cliente 3 -->
  <rect x="1090" y="375" width="260" height="90" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
  <text x="1220" y="397" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937">Usuário C — Tenant 12</text>
  <text x="1220" y="416" text-anchor="middle" font-family="monospace" font-size="10" fill="#047857">tenant:12:order:987</text>
  <text x="1220" y="434" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#6b7280">vendo o pedido #987 — ao vivo</text>

  <!-- Setas em leque: passo 3 -> clientes -->
  <line x1="960" y1="355" x2="1088" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="960" y1="355" x2="1088" y2="315" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="960" y1="355" x2="1088" y2="420" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Regra de entrega: faixa livre entre os containers e a legenda -->
  <text x="985" y="508" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151">entregue apenas às salas com correspondência — clientes fora dessas salas não recebem nada</text>

  <!-- Legenda -->
  <text x="700" y="555" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">O PHP verifica o evento assinado — seja de um webhook do parceiro ou de uma ação interna — e o repassa;</text>
  <text x="700" y="574" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">o servidor em tempo real valida o payload, resolve quais salas do Socket.IO devem recebê-lo (tenant, usuário ou entidade),</text>
  <text x="700" y="593" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">e envia a atualização ao vivo — o navegador renderiza de novo a parte afetada da página sem recarregar tudo.</text>
</svg>
